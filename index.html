<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 빌더 홈 (Product Builder Home)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
            width: 100%;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
            z-index: 0;
        }

        .menu-card * {
            position: relative;
            z-index: 1;
        }

        .menu-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1), 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .menu-icon {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 10px 20px rgba(15, 23, 42, 0.05);
            transition: transform 0.3s ease;
        }

        .menu-card:hover .menu-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .menu-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            background: linear-gradient(to right, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-desc {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="blob"></div>
    <div class="container" style="max-width: 1100px;">
        <h1>Mini Tool Box</h1>
        <p class="subtitle">다양한 유틸리티를 한 곳에서 편리하게 사용하세요</p>
        
        <div class="menu-grid">
            <a href="./Lotto/lotto.html" class="menu-card">
                <div class="menu-icon">🎰</div>
                <h2 class="menu-title">로또 번호 추첨기</h2>
                <p class="menu-desc">화려한 3D 애니메이션 효과와 함께 나만의 행운 번호를 추첨해 보세요.</p>
            </a>
            
            <a href="./Stock/stock.html" class="menu-card">
                <div class="menu-icon">📈</div>
                <h2 class="menu-title">My Stock</h2>
                <p class="menu-desc">실시간 주가 정보와 나의 관심 종목을 한눈에 관리해 보세요.</p>
            </a>

            <a href="#" class="menu-card" style="opacity: 0.5; cursor: not-allowed;" onclick="event.preventDefault();">
                <div class="menu-icon">✨</div>
                <h2 class="menu-title">준비 중</h2>
                <p class="menu-desc">새로운 도구가 곧 추가될 예정입니다. 기대해 주세요!</p>
            </a>
        </div>
    </div>
</body>
</html>
