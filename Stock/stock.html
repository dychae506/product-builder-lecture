<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stock - 관심종목 조회</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./stock.css">
</head>
<body>
    <div class="blob"></div>
    <a href="../index.html" style="position: absolute; top: 30px; left: 30px; color: #64748b; text-decoration: none; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; transition: all 0.3s ease; z-index: 10; font-weight: 600; background: rgba(255,255,255,0.5); padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(0,0,0,0.05); backdrop-filter: blur(10px);" onmouseover="this.style.color='#0f172a'; this.style.background='rgba(255,255,255,0.8)'" onmouseout="this.style.color='#64748b'; this.style.background='rgba(255,255,255,0.5)'">
        <span style="font-size: 1.4rem;">←</span> 메인으로
    </a>
    
    <div class="container" style="max-width: 1100px;">
        <h1>My Stock</h1>
        <p class="subtitle">네이버페이 증권에 등록된 나의 관심종목을 한눈에 확인하세요</p>

        <div class="stock-container">
            <div class="action-bar">
                <button id="fetchBtn" class="fetch-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        <path d="M12 8v4l3 3"></path>
                    </svg>
                    네이버 관심종목 가져오기
                </button>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <div id="loaderContainer" class="loader-container">
                <div class="loader"></div>
                <div class="loader-text">
                    데이터를 가져오고 있습니다...<br>
                    <span style="font-size: 0.9rem; font-weight: 400;">팝업 브라우저 창에서 네이버 로그인을 진행해 주세요.</span>
                </div>
            </div>

            <div id="tableWrapper" class="table-wrapper" style="display: none;">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th>종목명</th>
                            <th>현재가</th>
                            <th>전일대비</th>
                            <th>등락률</th>
                            <th>시가</th>
                            <th>고가</th>
                            <th>저가</th>
                            <th>거래량</th>
                            <th>거래대금</th>
                            <th>시가총액</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="./stock.js"></script>
</body>
</html>
